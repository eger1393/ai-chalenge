version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chatdb
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatuser -d chatdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-mcp:
    build:
      context: ./postgres-mcp
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://chatreader:chatreader_readonly@postgres:5432/chatdb
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  github-explorer-mcp:
    build:
      context: ./github-explorer-mcp
      dockerfile: Dockerfile
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "6500:3000"
    env_file:
      - .env
    environment:
      - MCP_POSTGRES_URL=http://postgres-mcp:8096/mcp
      - MCP_GITHUB_EXPLORER_URL=http://github-explorer-mcp:8097/mcp
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://167.235.226.104:6500/api
    ports:
      - "6501:3000"
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - backend

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
